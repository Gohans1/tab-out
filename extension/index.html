<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Out</title>


  <!-- Vercel Brand Guidelines Foundation -->
  <link rel="stylesheet" href="vercel-brand.css">
  <!-- Tab Out Page-Owned Custom Styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="vbg-report">
<div class="vbg-shell">
  <a class="vbg-skip-link" href="#main">Skip to content</a>

  <!-- ================================================================
       VERCEL AUTHORSHIP HEADER
       ================================================================ -->
  <header class="vbg-header">
    <div class="vbg-masthead">
      <span class="vbg-identity">
        <span class="vbg-wordmark" role="img" aria-label="Vercel"></span>
      </span>
      <div class="vbg-document-meta">
        <span class="vbg-date" id="dateDisplay"></span>
        <span class="vbg-meta"><strong id="statTabs">0</strong> open tabs</span>
      </div>
    </div>

    <h1 class="vbg-title" id="greeting">Active tabs</h1>
    <p class="vbg-lede" id="heroSubtitle">Workspace overview across all open windows.</p>
  </header>

  <!-- ================================================================
       MAIN DASHBOARD AREA
       ================================================================ -->
  <main id="main">
    <!-- TAB OUT DUPES BANNER -->
    <div class="tab-cleanup-banner" id="tabOutDupeBanner" style="display:none">
      <div class="tab-cleanup-left">
        <div class="tab-cleanup-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
          </svg>
        </div>
        <div class="tab-cleanup-text">
          You have <strong id="tabOutDupeCount"></strong> Tab Out tabs open. Keep just this one?
        </div>
      </div>
      <button class="tab-cleanup-btn" data-action="close-tabout-dupes">Close extras</button>
    </div>

    <!-- TWO-COLUMN LAYOUT -->
    <div class="dashboard-columns" id="dashboardColumns">

      <!-- LEFT COLUMN: Open tabs -->
      <div class="active-section" id="openTabsSection" style="display:none">
        <div class="section-header">
          <div class="section-header-left">
            <h2 class="section-title" id="openTabsSectionTitle">Open tabs</h2>
            <span class="section-count" id="openTabsSectionCount"></span>
          </div>
          <div class="section-header-right" id="openTabsHeaderActions"></div>
        </div>
        <div class="missions" id="openTabsMissions"></div>
      </div>

      <!-- RIGHT COLUMN: Saved for Later checklist -->
      <div class="deferred-column" id="deferredColumn">
        <div class="section-header">
          <h2 class="section-title">Saved for later</h2>
          <div class="section-count" id="deferredCount"></div>
        </div>

        <!-- Active checklist items -->
        <div class="deferred-list" id="deferredList" style="display:none"></div>

        <!-- Empty state -->
        <div class="deferred-empty" id="deferredEmpty">
          Nothing saved.
        </div>

        <!-- Archive section -->
        <div class="deferred-archive" id="deferredArchive" style="display:none">
          <button type="button" class="archive-toggle open" id="archiveToggle" data-action="toggle-archive" aria-expanded="true" aria-label="Toggle archive">
            <span class="archive-toggle-label">Archive <span class="archive-count" id="archiveCount"></span></span>
            <svg class="archive-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
          </button>
          <div class="archive-body" id="archiveBody">
            <div class="archive-search-wrap">
              <svg class="archive-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
              </svg>
              <input type="text" class="archive-search" id="archiveSearch" placeholder="Search archived tabs..." aria-label="Search archived tabs">
            </div>
            <div class="archive-list" id="archiveList"></div>
          </div>
        </div>
      </div>

    </div><!-- end .dashboard-columns -->
  </main>

  <!-- ================================================================
       VERCEL AUTHORSHIP FOOTER (Canonical Quiet Shell)
       ================================================================ -->
  <footer class="vbg-footer">
    <span class="vbg-logo" role="img" aria-label="Vercel"></span>
    <span><a href="https://github.com/zarazhangrui/tab-out" target="_blank" rel="noopener">Tab Out</a> &middot; Open source</span>
  </footer>

</div><!-- end .vbg-shell -->

<!-- TOAST NOTIFICATION -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </svg>
  <span id="toastText"></span>
</div>

<!-- Personal config (optional) -->
<script src="config.local.js"></script>

<!-- Dashboard logic -->
<script src="app.js"></script>
</body>
</html>
